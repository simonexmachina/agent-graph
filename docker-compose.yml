services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentgraph
      POSTGRES_PASSWORD: agentgraph
      POSTGRES_DB: agentgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
