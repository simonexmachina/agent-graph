[project]
name = "agentgraph"
version = "0.1.1"
description = "Local knowledge graph for AI agents — indexes Slack, Discord, Google Docs, Drive, Gmail, and your browser activity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "apscheduler>=3.11.2",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "sentence-transformers>=5.3.0",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
    "mcp>=1.26.0",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
google     = ["agentgraph-connector-google"]
slack      = ["agentgraph-connector-slack"]
discord    = ["agentgraph-connector-discord"]
feedly     = ["agentgraph-connector-feedly"]
all        = [
    "agentgraph-connector-google",
    "agentgraph-connector-slack",
    "agentgraph-connector-discord",
    "agentgraph-connector-feedly",
]

[dependency-groups]
dev = [
    "pygments>=2.19.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
agentgraph = "agentgraph.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a live database (deselect with '-m not integration')",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentgraph-connector-google  = { workspace = true }
agentgraph-connector-slack   = { workspace = true }
agentgraph-connector-discord = { workspace = true }
agentgraph-connector-feedly  = { workspace = true }

[tool.setuptools.packages.find]
include = ["agentgraph*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["agentgraph"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
