[project]
name = "agentgraph-connector-sharepoint"
version = "0.1.0"
description = "SharePoint and OneDrive connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agentgraph",
    "httpx>=0.28.1",
    "python-docx>=1.1.2",
]

[project.entry-points."agentgraph.connectors"]
sharepoint = "agentgraph_connector_sharepoint:SharePointConnector"

[tool.uv]
package = true

[tool.uv.sources]
agentgraph = { workspace = true }
