[project]
name = "agent-graph-connector-discord"
version = "0.5.0"
description = "Discord connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agent-graph>=0.5.0,<0.6",
    "httpx>=0.28.1",
]

[project.entry-points."agentgraph.connectors"]
discord = "agentgraph_connector_discord:DiscordConnector"

[tool.uv]
package = true

[tool.uv.sources]
agent-graph = { workspace = true }
