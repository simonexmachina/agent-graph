[project]
name = "agent-graph-connector-slack"
version = "0.5.0"
description = "Slack connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agent-graph>=0.5.0,<0.6",
    "httpx>=0.28.1",
]

[project.entry-points."agentgraph.connectors"]
slack = "agentgraph_connector_slack:SlackConnector"

[tool.uv]
package = true

[tool.uv.sources]
agent-graph = { workspace = true }

[tool.setuptools.package-data]
agentgraph_connector_slack = ["slack-app-manifest.json"]
