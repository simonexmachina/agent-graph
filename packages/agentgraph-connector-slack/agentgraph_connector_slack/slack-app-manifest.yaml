display_information:
  name: AgentGraph Internal
  description: Local Slack indexing for AgentGraph
  background_color: "#1f2937"
oauth_config:
  redirect_urls:
    - http://localhost:8766/slack/oauth/callback
  pkce_enabled: true
  token_management_enabled: true
  scopes:
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - users:read
      - users:read.email
    user_optional:
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
