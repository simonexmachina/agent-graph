[project]
name = "agentgraph-connector-rss"
version = "0.1.0"
description = "RSS and Atom connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agentgraph",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "questionary>=2.1.1",
]

[project.entry-points."agentgraph.connectors"]
rss = "agentgraph_connector_rss:RssConnector"

[tool.uv]
package = true

[tool.uv.sources]
agentgraph = { workspace = true }
