[project]
name = "agent-graph-connector-rss"
version = "0.5.0"
description = "RSS and Atom connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agent-graph>=0.5.0,<0.6",
    "agent-graph-connector-web>=0.5.0,<0.6",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[project.entry-points."agentgraph.connectors"]
rss = "agentgraph_connector_rss:RssConnector"

[tool.uv]
package = true

[tool.uv.sources]
agent-graph = { workspace = true }
agent-graph-connector-web = { workspace = true }
