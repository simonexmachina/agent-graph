name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra all

      - name: Build docs
        run: uv run python scripts/build_docs.py

      - name: Run tests
        run: uv run pytest tests/ -m "not integration" -q

      - name: Type check
        run: uv run pyright

      - name: Lint
        run: uv run ruff check agentgraph/

  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra all

      - name: Run deterministic performance smoke suite
        run: uv run python -m benchmarks.suite --entities 1000 --iterations 3 --vector-mode sqlite-vec --output .benchmarks/smoke.json
