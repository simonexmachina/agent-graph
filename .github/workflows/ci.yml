name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra all

      - name: Build docs
        run: python3 scripts/build_docs.py

      - name: Run tests
        run: uv run pytest tests/ -m "not integration" -q

      - name: Lint
        run: uv run ruff check agentgraph/
