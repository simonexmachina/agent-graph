name: Extension Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Typecheck extension
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Archive extension bundle
        run: cd dist && zip -r -X ../../agentgraph-extension.zip .

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: agentgraph-extension.zip

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: agentgraph-extension.zip
          extension-id: iilkfclglabllelhjacijldknapbhidi
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentgraph-extension-zip
          path: agentgraph-extension.zip
