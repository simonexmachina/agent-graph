name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

jobs:
  server-side-workloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra all
      - name: Run medium workload suite
        run: uv run python -m benchmarks.suite --entities 10000 --iterations 20 --output .benchmarks/latest.json
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: .benchmarks/latest.json
