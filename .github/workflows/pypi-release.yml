name: PyPI Release

on:
  push:
    tags:
      - "agentgraph-server-v*"
      - "agentgraph-connector-*-v*"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve release package
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/release_package.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build --package "${{ needs.resolve.outputs.package }}" --out-dir "dist/${{ needs.resolve.outputs.package }}"

      - name: Validate distribution
        run: uvx twine check "dist/${{ needs.resolve.outputs.package }}"/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-${{ needs.resolve.outputs.package }}
          path: dist/${{ needs.resolve.outputs.package }}/
          retention-days: 1

  publish-server:
    needs: [resolve, build]
    if: needs.resolve.outputs.package == 'agentgraph-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-agentgraph-server
          path: dist/agentgraph-server/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/agentgraph-server/

  publish-connectors:
    needs: [resolve, build]
    if: needs.resolve.outputs.package != 'agentgraph-server'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-${{ needs.resolve.outputs.package }}
          path: dist/${{ needs.resolve.outputs.package }}/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ needs.resolve.outputs.package }}/
