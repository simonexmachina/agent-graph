name: PyPI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          projects = [root / "pyproject.toml", *sorted((root / "packages").glob("*/pyproject.toml"))]
          versions = {
              path.relative_to(root).as_posix(): tomllib.loads(path.read_text())["project"]["version"]
              for path in projects
          }
          mismatches = {path: version for path, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"Package versions do not match {expected}: {mismatches}")
          PY

      - name: Build distributions
        run: |
          uv build --package agentgraph-server --out-dir dist/agentgraph-server
          uv build --package agentgraph-connector-discord --out-dir dist/agentgraph-connector-discord
          uv build --package agentgraph-connector-google --out-dir dist/agentgraph-connector-google
          uv build --package agentgraph-connector-rss --out-dir dist/agentgraph-connector-rss
          uv build --package agentgraph-connector-slack --out-dir dist/agentgraph-connector-slack
          uv build --package agentgraph-connector-web --out-dir dist/agentgraph-connector-web

      - name: Validate distributions
        run: uvx twine check dist/*/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          retention-days: 1

  publish-server:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/agentgraph-server/

  publish-connectors:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package:
          - agentgraph-connector-discord
          - agentgraph-connector-google
          - agentgraph-connector-rss
          - agentgraph-connector-slack
          - agentgraph-connector-web
    runs-on: ubuntu-latest
    environment: ${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
