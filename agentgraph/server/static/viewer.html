<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentGraph Viewer</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/@mozilla/readability@0.5.0/Readability.js"></script>
<script src="https://unpkg.com/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #0d0f14;
    --surface:      #141720;
    --surface2:     #1a1f2e;
    --border:       #242938;
    --border-bright:#2e3650;
    --accent:       #e8a045;
    --accent-dim:   #a06820;
    --green:        #4ade80;
    --blue:         #60a5fa;
    --purple:       #a78bfa;
    --pink:         #f472b6;
    --cyan:         #22d3ee;
    --text:         #e2e8f0;
    --text-muted:   #64748b;
    --text-dim:     #94a3b8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  /* ── layout ────────────────────────────────────────────────────────────── */
  #app {
    display: flex;
    height: 100vh;
  }

  /* ── sidebar ───────────────────────────────────────────────────────────── */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 12px;
    gap: 16px;
  }

  #sidebar h1 a {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-decoration: none;
    text-transform: uppercase;
  }

  #sidebar h1 a:hover {
    color: var(--text);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label.group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  input[type="text"],
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus,
  select:focus {
    border-color: var(--accent);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 13px;
    height: 13px;
  }

  .checkbox-row span {
    color: var(--text-dim);
    font-size: 12px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .range-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .range-row span {
    color: var(--accent);
    font-size: 12px;
    min-width: 32px;
    text-align: right;
  }

  button {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text-dim);
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    width: 100%;
  }

  button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .focus-node-actions {
    display: flex;
    gap: 6px;
  }

  .focus-node-actions button {
    flex: 1;
  }

  /* ── canvas area ────────────────────────────────────────────────────────── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #view-tabs {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 7;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    overflow: hidden;
  }

  .view-tab {
    width: auto;
    border: 0;
    border-radius: 0;
    padding: 6px 10px;
    color: var(--text-muted);
  }

  .view-tab + .view-tab { border-left: 1px solid var(--border-bright); }
  .view-tab.active { background: var(--surface2); color: var(--accent); }

  #list-view {
    display: none;
    width: 100%;
    height: 100%;
    padding: 52px 12px 12px;
  }

  #node-table {
    height: 100%;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  #node-list {
    width: 100%;
    min-width: 1120px;
    border-collapse: collapse;
    color: var(--text);
  }

  #node-list th,
  #node-list td {
    padding: 7px 9px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  #node-list th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  #node-list tbody tr { cursor: pointer; }
  #node-list tbody tr:nth-child(even) { background: #11141c; }
  #node-list tbody tr:hover,
  #node-list tbody tr:focus-visible { background: var(--surface2); outline: none; }
  #node-list td:nth-child(1) { min-width: 240px; width: 30%; }
  #node-list td:nth-child(2),
  #node-list td:nth-child(3) { width: 110px; }
  #node-list td:nth-child(4),
  #node-list td:nth-child(5),
  #node-list td:nth-child(6) { width: 175px; white-space: nowrap; }
  #node-list td:nth-child(7) { width: 80px; text-align: right; }
  #node-list td:nth-child(8) { min-width: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

  .list-sort {
    width: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
  }

  .list-sort:hover { border: 0; color: var(--accent); }
  .list-sort[data-direction="asc"]::after { content: " ↑"; }
  .list-sort[data-direction="desc"]::after { content: " ↓"; }

  #list-empty {
    padding: 24px;
    color: var(--text-muted);
    text-align: center;
  }

  #more-btn {
    display: none;
    position: absolute;
    right: 20px;
    bottom: 20px;
    z-index: 7;
    width: auto;
    min-width: 72px;
    color: var(--text);
    background: var(--surface2);
    border-color: var(--accent-dim);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  #cy {
    width: 100%;
    height: 100%;
  }

  #hover-card {
    position: absolute;
    min-width: 180px;
    max-width: 320px;
    padding: 10px 12px;
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    background: rgba(20, 23, 32, 0.96);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    z-index: 6;
    display: none;
    backdrop-filter: blur(8px);
  }

  #hover-card.open {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #hover-card-type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #hover-card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  #hover-card-meta {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  #hover-card-snippet {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.45;
    word-break: break-word;
  }

  /* ── spinner ────────────────────────────────────────────────────────────── */
  #spinner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13, 15, 20, 0.55);
    z-index: 10;
    pointer-events: none;
  }

  #spinner.active {
    display: flex;
  }

  .spinner-ring {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border-bright);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── detail panel ───────────────────────────────────────────────────────── */
  #detail {
    width: 300px;
    min-width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 5;
  }

  #detail.open {
    transform: translateX(0);
  }

  #detail-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  #detail-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
    word-break: break-word;
  }

  #detail-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-icon-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px;
    width: 22px;
    height: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .detail-icon-btn:hover {
    color: var(--accent);
    border: none;
  }

  .detail-icon-btn:disabled {
    cursor: default;
    opacity: 1;
  }

  .bookmark-glyph {
    width: 12px;
    height: 16px;
    display: block;
    overflow: visible;
    fill: transparent;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linejoin: round;
  }

  #detail-bookmark[aria-pressed="true"] {
    color: #fbbf24;
  }

  #detail-bookmark[aria-pressed="true"] .bookmark-glyph {
    fill: currentColor;
  }

  #detail-delete:hover {
    color: #f87171;
  }

  .delete-glyph {
    width: 14px;
    height: 14px;
    display: block;
    overflow: visible;
    fill: transparent;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #detail-close {
    font-size: 16px;
  }

  #detail-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .detail-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .detail-row .detail-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
  }

  .detail-row .detail-value {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
  }

  .person-merge-error {
    color: #fca5a5;
    font-size: 11px;
    line-height: 1.4;
    display: none;
  }

  .merged-people-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .merged-person-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.4;
    padding: 6px 8px;
    word-break: break-word;
  }

  .merged-person-item strong {
    color: var(--text);
    display: block;
    font-weight: 600;
  }

  .content-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .content-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .content-format {
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .content-format:hover,
  .content-format:focus-visible {
    color: var(--text);
  }

  .content-format[aria-expanded="false"]::before { content: "+ "; }
  .content-format[aria-expanded="true"]::before { content: "- "; }

  .content-tabs {
    display: flex;
    gap: 3px;
  }

  .content-tab {
    width: auto;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    padding: 3px 6px;
    font-size: 10px;
  }

  .content-tab[aria-selected="true"] {
    border-color: var(--border-bright);
    color: var(--text);
    background: var(--surface2);
  }

  .content-tab:disabled,
  .content-tab:disabled:hover {
    border-color: transparent;
    color: var(--text-muted);
    cursor: default;
    opacity: 0.45;
  }

  .content-preview,
  .content-source {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #10131b;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.65;
    overflow: auto;
  }

  .content-preview {
    padding: 14px 16px;
  }

  .content-preview > :first-child { margin-top: 0; }
  .content-preview > :last-child { margin-bottom: 0; }
  .content-preview h1,
  .content-preview h2,
  .content-preview h3,
  .content-preview h4 {
    color: var(--text);
    line-height: 1.3;
    margin: 1.2em 0 0.45em;
  }
  .content-preview h1 { font-size: 20px; }
  .content-preview h2 { font-size: 17px; }
  .content-preview h3 { font-size: 15px; }
  .content-preview h4 { font-size: 13px; }
  .content-preview p,
  .content-preview ul,
  .content-preview ol,
  .content-preview blockquote,
  .content-preview pre,
  .content-preview table {
    margin: 0.75em 0;
  }
  .content-preview ul,
  .content-preview ol { padding-left: 1.4em; }
  .content-preview blockquote {
    border-left: 3px solid var(--accent-dim);
    color: var(--text-muted);
    padding-left: 10px;
  }
  .content-preview a {
    color: var(--blue);
    overflow-wrap: anywhere;
  }
  .content-preview code,
  .content-preview pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .content-preview code {
    background: var(--surface2);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 0.9em;
  }
  .content-preview pre {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: auto;
    padding: 10px;
  }
  .content-preview pre code {
    background: transparent;
    padding: 0;
  }
  .content-preview table {
    border-collapse: collapse;
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }
  .content-preview th,
  .content-preview td {
    border: 1px solid var(--border-bright);
    padding: 4px 7px;
    text-align: left;
  }

  .content-source {
    display: block;
    margin: 0;
    padding: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.55;
  }

  .content-preview[hidden],
  .content-source[hidden] {
    display: none;
  }

  .tag {
    display: inline-block;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 0.03em;
  }

  .edges-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .edge-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.12s;
  }

  .edge-item:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .edge-item .edge-type-tag {
    font-weight: 700;
    font-family: monospace;
    font-size: 10px;
    margin-right: 4px;
  }

  /* ── empty state ────────────────────────────────────────────────────────── */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <h1><a href="/viewer">AgentGraph</a></h1>

    <div class="control-group">
      <label class="group-label">Search</label>
      <input type="text" id="search-input" placeholder="Search entities…" />
    </div>

    <div class="control-group" id="type-filter-group">
      <label class="group-label">Entity Types</label>
    </div>

    <div class="control-group">
      <label class="group-label" for="platform-filter">Platform</label>
      <select id="platform-filter">
        <option value="">All platforms</option>
      </select>
    </div>

    <div class="control-group">
      <label class="group-label" for="since-filter">Time range</label>
      <select id="since-filter">
        <option value="">All time</option>
        <option value="24h">Last 24 hours</option>
        <option value="7d">Last 7 days</option>
      </select>
    </div>

    <div class="control-group">
      <label class="group-label">Limit: <span id="limit-display">50</span></label>
      <div class="range-row">
        <input type="range" id="limit-slider" min="10" max="1000" value="50" />
      </div>
    </div>

    <hr style="border:none; border-top:1px solid #334155; margin:8px 0;" />

    <div class="control-group">
      <label class="group-label">Focus Node</label>
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <label style="font-size:11px; color:#94a3b8; white-space:nowrap;">Depth</label>
        <input type="number" id="depth-input" min="0" max="4" value="2"
               style="width:52px; padding:2px 6px; background:#1e293b; border:1px solid #334155;
                      border-radius:4px; color:#e2e8f0; font-size:12px;" />
      </div>
      <input type="text" id="lookup-input" placeholder="Entity UUID, prefix, or platform reference" />
      <div class="focus-node-actions">
        <button id="lookup-btn">Go</button>
        <button id="focus-reset-btn" type="button">Reset</button>
      </div>
      <div id="lookup-error" style="display:none; color:#f87171; font-size:11px; margin-top:2px;"></div>
    </div>

    <hr style="border:none; border-top:1px solid #334155; margin:8px 0;" />

    <button id="reset-btn">Reset view</button>
    <button id="refresh-btn">Refresh view</button>
  </aside>

  <!-- ── Canvas ──────────────────────────────────────────────────────────── -->
  <div id="canvas-wrap">
    <div id="view-tabs" role="tablist" aria-label="Viewer mode">
      <button class="view-tab" id="graph-tab" role="tab" aria-selected="true">Graph</button>
      <button class="view-tab" id="list-tab" role="tab" aria-selected="false">List</button>
    </div>
    <div id="cy"></div>
    <div id="list-view">
      <div id="node-table">
        <table id="node-list" aria-label="Entities">
          <thead>
            <tr>
              <th scope="col"><button class="list-sort" type="button" data-sort="display_name">Name</button></th>
              <th scope="col"><button class="list-sort" type="button" data-sort="entity_type">Type</button></th>
              <th scope="col"><button class="list-sort" type="button" data-sort="platform">Platform</button></th>
              <th scope="col"><button class="list-sort" type="button" data-sort="updated_at">Updated</button></th>
              <th scope="col"><button class="list-sort" type="button" data-sort="last_accessed">Last accessed</button></th>
              <th scope="col"><button class="list-sort" type="button" data-sort="created_at">Created</button></th>
              <th scope="col">Dwell</th>
              <th scope="col">ID</th>
            </tr>
          </thead>
          <tbody id="node-list-body"></tbody>
        </table>
        <div id="list-empty" hidden>No entities to display</div>
      </div>
    </div>
    <button id="more-btn" type="button">More</button>
    <div id="hover-card">
      <div id="hover-card-type"></div>
      <div id="hover-card-title"></div>
      <div id="hover-card-meta"></div>
      <div id="hover-card-snippet"></div>
    </div>
    <div id="spinner"><div class="spinner-ring"></div></div>
    <div id="empty-state" style="display:none">No entities to display</div>
  </div>

  <!-- ── Detail panel ────────────────────────────────────────────────────── -->
  <div id="detail">
    <div id="detail-header">
      <div id="detail-title">—</div>
      <div id="detail-actions">
        <button id="detail-bookmark" class="detail-icon-btn" title="Not bookmarked" aria-label="Bookmark entity" aria-pressed="false">
          <svg class="bookmark-glyph" viewBox="0 0 16 20" aria-hidden="true" focusable="false">
            <path d="M4 2.5h8v14l-4-2.75-4 2.75z"></path>
          </svg>
        </button>
        <button id="detail-delete" class="detail-icon-btn" title="Delete entity" aria-label="Delete entity">
          <svg class="delete-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="M6 6l1 14h10l1-14"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
          </svg>
        </button>
        <button id="detail-close" class="detail-icon-btn" title="Close">✕</button>
      </div>
    </div>
    <div id="detail-body"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── Colour maps ───────────────────────────────────────────────────────────
  const NODE_COLORS = {
    Person:      '#4ade80',
    Message:     '#60a5fa',
    Channel:     '#a78bfa',
    Document:    '#22d3ee',
    Spreadsheet: '#34d399',
    Folder:      '#fbbf24',
    Thread:      '#f97316',
  };

  const EDGE_COLORS = {
    authored:    '#4ade80',
    posted_in:   '#a78bfa',
    replied_to:  '#60a5fa',
    mentions:    '#f472b6',
    collaborated:'#22d3ee',
  };

  function nodeColor(type) {
    return NODE_COLORS[type] || '#94a3b8';
  }

  function edgeColor(type) {
    return EDGE_COLORS[type] || '#64748b';
  }

  function truncateLabel(label, maxLength) {
    if (!label) return '';
    return label.length > maxLength ? `${label.slice(0, maxLength - 1)}…` : label;
  }

  // ── Cytoscape init ────────────────────────────────────────────────────────
  const cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      {
        selector: 'node',
        style: {
          'background-color': (ele) => nodeColor(ele.data('entity_type')),
          'label': (ele) => {
            const type = ele.data('entity_type') || '';
            const lbl = truncateLabel(ele.data('label') || '', 30);
            const marker = ele.data('bookmarked') ? '🔖 ' : '';
            return `${marker}[${type}]\n${lbl}`;
          },
          'color': '#e2e8f0',
          'font-size': '12px',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'text-margin-y': '4px',
          'text-wrap': 'wrap',
          'text-max-width': '150px',
          'width': '28px',
          'height': '28px',
          'border-width': '2px',
          'border-color': (ele) => nodeColor(ele.data('entity_type')),
          'border-opacity': 0.5,
        },
      },
      {
        selector: 'node:selected',
        style: {
          'border-opacity': 1,
          'border-color': '#e8a045',
        },
      },
      {
        selector: 'node[?bookmarked]',
        style: {
          'border-opacity': 1,
          'border-color': '#fbbf24',
          'border-width': '3px',
        },
      },
      {
        selector: 'edge',
        style: {
          'line-color': (ele) => edgeColor(ele.data('edge_type')),
          'target-arrow-color': (ele) => edgeColor(ele.data('edge_type')),
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'opacity': 0.65,
          'width': 1.5,
          'label': (ele) => ele.data('edge_type') || '',
          'font-size': '10px',
          'color': '#64748b',
          'text-background-color': '#0d0f14',
          'text-background-opacity': 0.7,
          'text-background-padding': '2px',
        },
      },
      {
        selector: 'edge:selected',
        style: { opacity: 1, width: 2.5 },
      },
    ],
    layout: { name: 'grid' },
    userZoomingEnabled: true,
    userPanningEnabled: true,
  });
  window.__agentGraphViewer = { cy };

  // ── Zoom-invariant sizing ─────────────────────────────────────────────────
  const Z = { nodeSize: 28, nodeFont: 12, textMaxWidth: 150, textMarginY: 4, nodeBorder: 2, edgeFont: 10, edgeWidth: 1.5, arrowScale: 1.5 };
  const DEFAULT_LAYOUT_PADDING = 60;
  const READABLE_GRID_CELL_WIDTH = 165;
  const READABLE_GRID_CELL_HEIGHT = 90;

  function applyZoomStyles() {
    const z = cy.zoom();
    // Below z=0.5 stop compensating — otherwise node model-space radii exceed
    // inter-node distances and eat the edges, making arrowheads disappear.
    const zc = Math.max(z, 0.5);
    cy.batch(() => {
      cy.nodes().style({
        'width':          Z.nodeSize / zc,
        'height':         Z.nodeSize / zc,
        'font-size':      Z.nodeFont / zc,
        'text-max-width': Z.textMaxWidth / zc,
        'text-margin-y':  Z.textMarginY / zc,
        'border-width':   Z.nodeBorder / zc,
      });
      cy.nodes('[?bookmarked]').style({
        'border-width': (Z.nodeBorder + 1) / zc,
      });
      cy.edges().style({
        'font-size':   Z.edgeFont / zc,
        'width':       Z.edgeWidth / zc,
        'arrow-scale': Z.arrowScale / z,
      });
    });
  }

  cy.on('zoom', applyZoomStyles);

  function fitGraphToViewport() {
    if (cy.nodes().length === 0) return;
    cy.fit(cy.nodes(), DEFAULT_LAYOUT_PADDING);
    applyZoomStyles();
  }

  function readableGridPositionFor(index, count) {
    const usableWidth = Math.max(cy.width() - (DEFAULT_LAYOUT_PADDING * 2), READABLE_GRID_CELL_WIDTH);
    const columns = Math.max(1, Math.floor(usableWidth / READABLE_GRID_CELL_WIDTH));
    const totalWidth = ((Math.min(count, columns) - 1) * READABLE_GRID_CELL_WIDTH);
    const xOffset = Math.max(DEFAULT_LAYOUT_PADDING, (cy.width() - totalWidth) / 2);

    return {
      x: xOffset + ((index % columns) * READABLE_GRID_CELL_WIDTH),
      y: DEFAULT_LAYOUT_PADDING + (Math.floor(index / columns) * READABLE_GRID_CELL_HEIGHT),
    };
  }

  function readableGridPositions() {
    const nodes = cy.nodes();
    const positions = {};
    nodes.forEach((node, index) => {
      positions[node.id()] = readableGridPositionFor(index, nodes.length);
    });
    return positions;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  const spinner = document.getElementById('spinner');
  const emptyState = document.getElementById('empty-state');
  const hoverCard = document.getElementById('hover-card');
  const hoverCardType = document.getElementById('hover-card-type');
  const hoverCardTitle = document.getElementById('hover-card-title');
  const hoverCardMeta = document.getElementById('hover-card-meta');
  const hoverCardSnippet = document.getElementById('hover-card-snippet');

  // ── UI refs ───────────────────────────────────────────────────────────────
  const searchInput   = document.getElementById('search-input');
  const typeFilters   = () => [...document.querySelectorAll('.type-filter')].filter(c => c.checked).map(c => c.value);
  function activeEntityTypes() {
    const selected = typeFilters();
    const allTypesSelected = selected.length === ALL_TYPES.length
      && ALL_TYPES.every(type => selected.includes(type));
    return allTypesSelected ? undefined : selected;
  }
  const platformSel   = document.getElementById('platform-filter');
  const sinceSel      = document.getElementById('since-filter');
  const limitSlider   = document.getElementById('limit-slider');
  const limitDisplay  = document.getElementById('limit-display');
  const lookupInput   = document.getElementById('lookup-input');
  const lookupBtn     = document.getElementById('lookup-btn');
  const focusResetBtn = document.getElementById('focus-reset-btn');
  const lookupError   = document.getElementById('lookup-error');
  const depthInput    = document.getElementById('depth-input');
  const resetBtn      = document.getElementById('reset-btn');
  const refreshBtn    = document.getElementById('refresh-btn');
  const detail        = document.getElementById('detail');
  const detailTitle   = document.getElementById('detail-title');
  const detailBody    = document.getElementById('detail-body');
  const detailBookmark = document.getElementById('detail-bookmark');
  const detailDelete  = document.getElementById('detail-delete');
  const detailClose   = document.getElementById('detail-close');
  const graphTab      = document.getElementById('graph-tab');
  const listTab       = document.getElementById('list-tab');
  const listView      = document.getElementById('list-view');
  const nodeTable     = document.getElementById('node-table');
  const listBody      = document.getElementById('node-list-body');
  const listEmpty     = document.getElementById('list-empty');
  const moreBtn       = document.getElementById('more-btn');

  // ── Fetch helpers ─────────────────────────────────────────────────────────
  function showSpinner() { spinner.classList.add('active'); }
  function hideSpinner() { spinner.classList.remove('active'); }

  function buildUrl(base, params) {
    const q = new URLSearchParams();
    for (const [k, v] of Object.entries(params)) {
      if (v === null || v === undefined || v === '') continue;
      if (Array.isArray(v)) {
        v.forEach(x => q.append(k, x));
      } else {
        q.set(k, String(v));
      }
    }
    const s = q.toString();
    return s ? `${base}?${s}` : base;
  }

  // ── Cytoscape formatting ───────────────────────────────────────────────────
  function entityToNode(entity) {
    const label = entity.viewer_label || entity.display_name || entity.title || entity.platform_entity_id || entity.id || '';
    return {
      data: {
        id: entity.id,
        label,
        entity_type: entity.entity_type,
        platform: entity.platform,
        platform_entity_id: entity.platform_entity_id || '',
        content: (entity.content || '').substring(0, 200),
        bookmarked: Boolean(entity.bookmarked),
      }
    };
  }

  function edgeToCyto(edge, nodeIdSet) {
    const src = edge.source_entity_id;
    const tgt = edge.target_entity_id;
    if (!src || !tgt || !nodeIdSet.has(src) || !nodeIdSet.has(tgt)) return null;
    return { data: { id: edge.id, source: src, target: tgt, edge_type: edge.edge_type } };
  }

  let _lastBrowseUrl = null;
  let _lastListUrl = null;
  let viewerCache = null;

  function setMoreAvailable(hasMore) {
    const limitCanIncrease = Number(limitSlider.value) < Number(limitSlider.max);
    moreBtn.style.display = hasMore && limitCanIncrease ? 'block' : 'none';
  }

  function viewerScopeKey(params) {
    return buildUrl('/api/cli/browse/nodes', {
      search: params.search,
      entity_type: params.entity_type,
      platform: params.platform,
      since: params.since,
      node_id: params.node_id,
      depth: params.depth,
      limit: params.limit,
      sort: params.sort,
      sort_dir: params.sort_dir,
    });
  }

  function rawNodesToGraphNodes(rawNodes) {
    return rawNodes.map(entityToNode);
  }

  function renderCachedGraph(params) {
    if (!viewerCache || viewerCache.key !== viewerScopeKey(params)) return false;
    setMoreAvailable(viewerCache.hasMore);
    renderGraph({
      nodes: rawNodesToGraphNodes(viewerCache.rawNodes),
      edges: viewerCache.edges,
    });
    return true;
  }

  function renderCachedList(params) {
    if (!viewerCache || viewerCache.key !== viewerScopeKey(params)) return false;
    setMoreAvailable(viewerCache.hasMore);
    renderList(viewerCache.rawNodes, params);
    return true;
  }

  function invalidateGraphCache() {
    _lastBrowseUrl = null;
    _lastListUrl = null;
    viewerCache = null;
  }

  async function loadGraph(params) {
    const url = buildUrl('/api/cli/browse/nodes', { ...params, page: 1, size: params.limit });
    if (url === _lastBrowseUrl) return;
    _lastBrowseUrl = url;
    setMoreAvailable(false);
    showSpinner();
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const nodes = (data.data || []).map(entityToNode);
      const nodeIdSet = new Set(nodes.map(n => n.data.id));
      const edgeUrl = buildUrl('/api/cli/browse/edges', { node_ids: [...nodeIdSet].join(',') });
      const edgesRes = await fetch(edgeUrl);
      if (!edgesRes.ok) throw new Error(`HTTP ${edgesRes.status}`);
      const edgeData = await edgesRes.json();
      const edges = (edgeData.edges || []).map(e => edgeToCyto(e, nodeIdSet)).filter(Boolean);
      viewerCache = {
        key: viewerScopeKey(params),
        rawNodes: data.data || [],
        edges,
        hasMore: Boolean(data.has_more),
      };
      setMoreAvailable(viewerCache.hasMore);
      renderGraph({ nodes, edges });
    } catch (err) {
      console.error('loadGraph error:', err);
    } finally {
      hideSpinner();
    }
  }

  function renderGraph(data) {
    const nodes = data.nodes || [];
    const edges = data.edges || [];

    // Cytoscape is hidden while list mode is active, so refresh its viewport before positioning nodes.
    cy.resize();
    cy.elements().remove();

    const elements = [
      ...nodes,
      ...edges,
    ];

    cy.add(elements);
    applyZoomStyles();

    if (cy.nodes().length === 0) {
      hideHoverCard();
      emptyState.style.display = 'flex';
    } else {
      emptyState.style.display = 'none';
      runLayout();
    }
  }

  function runLayout() {
    if (cy.edges().length === 0) {
      const layout = cy.layout({
        name: 'preset',
        animate: false,
        fit: false,
        positions: readableGridPositions(),
      });
      layout.one('layoutstop', () => {
        fitGraphToViewport();
      });
      layout.run();
      return;
    }

    const layout = cy.layout({
      name: 'cose',
      animate: false,
      randomize: false,
      nodeDimensionsIncludeLabels: true,
      nodeRepulsion: () => 800000,
      idealEdgeLength: () => 180,
      nodeOverlap: 30,
      gravity: 0.18,
      numIter: 1000,
      refresh: 20,
      fit: false,
      padding: DEFAULT_LAYOUT_PADDING,
    });
    layout.one('layoutstop', () => {
      fitGraphToViewport();
    });
    layout.run();
  }

  // ── URL state ─────────────────────────────────────────────────────────────
  let ALL_TYPES = ['Channel', 'Document', 'Folder', 'Message', 'Person', 'Spreadsheet', 'Thread'];
  let FETCHABLE_PLATFORMS = new Set();
  const DEFAULT_LIST_SORT = 'last_accessed';
  const DEFAULT_LIST_SORT_DIR = 'desc';

  function readUrlState() {
    const p = new URLSearchParams(window.location.search);
    return {
      search:      p.get('search')   || '',
      platform:    p.get('platform') || '',
      since:       p.get('since')    || '',
      limit:       p.has('limit')    ? Number(p.get('limit')) : 50,
      node_id:   p.get('node_id') || null,
      depth:       p.has('depth')    ? Number(p.get('depth')) : 1,
      view:        p.get('view') === 'list' ? 'list' : 'graph',
      sort:        p.get('sort') || DEFAULT_LIST_SORT,
      sort_dir:    p.get('sort_dir') === 'asc' ? 'asc' : DEFAULT_LIST_SORT_DIR,
      entity_type: p.has('entity_type') ? p.getAll('entity_type') : ALL_TYPES,
    };
  }

  function applyUrlState(state) {
    searchInput.value  = state.search;
    platformSel.value  = state.platform;
    sinceSel.value     = state.since;
    limitSlider.value  = state.limit;
    limitDisplay.textContent = state.limit;
    if (state.node_id) lookupInput.value = state.node_id;
    depthInput.value = state.depth;
    setView(state.view, false);
    document.querySelectorAll('.type-filter').forEach(cb => {
      cb.checked = state.entity_type.includes(cb.value);
    });
  }

  function pushUrlState(params, replace = false) {
    const q = new URLSearchParams();
    if (params.search)    q.set('search', params.search);
    if (params.platform)  q.set('platform', params.platform);
    if (params.since)     q.set('since', params.since);
    if (params.limit && params.limit !== 50) q.set('limit', params.limit);
    if (params.node_id) q.set('node_id', params.node_id);
    if (params.depth !== undefined && params.depth !== 1) q.set('depth', params.depth);
    if (params.view === 'list') q.set('view', 'list');
    if (params.sort && params.sort !== DEFAULT_LIST_SORT) q.set('sort', params.sort);
    if (params.sort_dir && params.sort_dir !== DEFAULT_LIST_SORT_DIR) {
      q.set('sort_dir', params.sort_dir);
    }
    const types = params.entity_type || [];
    if (types.length && types.length < ALL_TYPES.length) {
      types.forEach(t => q.append('entity_type', t));
    }
    const qs = q.toString();
    const url = qs ? `?${qs}` : window.location.pathname;
    if (replace) {
      history.replaceState(null, '', url);
    } else {
      history.pushState(null, '', url);
    }
  }

  function collectParams(override, replace = false) {
    const current = readUrlState();
    const params = {
      search:      searchInput.value.trim() || undefined,
      entity_type: activeEntityTypes(),
      platform:    platformSel.value || undefined,
      since:       sinceSel.value || undefined,
      limit:       Number(limitSlider.value),
      node_id:   lookupInput.value.trim() || undefined,
      depth:       depthInput.value === '' ? undefined : Number(depthInput.value),
      view:        currentView(),
      sort:        current.sort,
      sort_dir:    current.sort_dir,
      ...override,
    };
    pushUrlState(params, replace);
    return params;
  }

  function refreshGraph(override) {
    return refreshView(collectParams(override));
  }

  function forceRefreshGraph(override) {
    invalidateGraphCache();
    return refreshGraph(override);
  }

  function currentView() {
    return listView.style.display === 'block' ? 'list' : 'graph';
  }

  function setView(view, refresh = true) {
    const isList = view === 'list';
    listView.style.display = isList ? 'block' : 'none';
    document.getElementById('cy').style.display = isList ? 'none' : 'block';
    if (!isList) cy.resize();
    document.getElementById('hover-card').style.display = 'none';
    graphTab.classList.toggle('active', !isList);
    graphTab.setAttribute('aria-selected', String(!isList));
    listTab.classList.toggle('active', isList);
    listTab.setAttribute('aria-selected', String(isList));
    if (refresh) {
      const params = collectParams({ view }, true);
      if ((isList && renderCachedList(params)) || (!isList && renderCachedGraph(params))) return;
      refreshView(params);
    }
  }

  function refreshView(params) {
    setMoreAvailable(false);
    if (params.view === 'list') {
      return loadList(params);
    }
    return loadGraph(params);
  }

  function formatDate(value) {
    return value ? new Date(value).toLocaleString() : '—';
  }

  function formatDwell(value) {
    const ms = Number(value || 0);
    if (ms < 1000) return '—';
    if (ms < 60000) return `${Math.round(ms / 1000)}s`;
    return `${Math.round(ms / 60000)}m`;
  }

  function truncateListName(value) {
    const maxLength = 100;
    return value.length > maxLength ? `${value.slice(0, maxLength - 3)}...` : value;
  }

  function updateListSortHeaders(params) {
    document.querySelectorAll('.list-sort').forEach(button => {
      const isActive = button.dataset.sort === params.sort;
      const direction = isActive ? params.sort_dir : '';
      button.dataset.direction = direction;
      button.closest('th').setAttribute(
        'aria-sort',
        isActive ? (direction === 'asc' ? 'ascending' : 'descending') : 'none',
      );
    });
  }

  function addListCell(row, value) {
    const cell = document.createElement('td');
    cell.textContent = value;
    row.appendChild(cell);
  }

  function renderList(rawNodes, params) {
    listBody.replaceChildren();
    listEmpty.hidden = rawNodes.length > 0;
    updateListSortHeaders(params);

    rawNodes.forEach(entity => {
      const row = document.createElement('tr');
      row.tabIndex = 0;
      row.dataset.entityId = entity.id;
      const name = entity.display_name || entity.viewer_label || entity.title || entity.platform_entity_id || entity.id;
      addListCell(row, truncateListName(name));
      addListCell(row, entity.entity_type || '—');
      addListCell(row, entity.platform || '—');
      addListCell(row, formatDate(entity.updated_at));
      addListCell(row, formatDate(entity.last_accessed));
      addListCell(row, formatDate(entity.created_at));
      addListCell(row, formatDwell(entity.cumulative_dwell_ms));
      addListCell(row, entity.id);
      row.addEventListener('click', () => showEntityDetail(entity.id));
      row.addEventListener('dblclick', () => focusNode(entity.id));
      row.addEventListener('keydown', event => {
        if (event.key === 'Enter') showEntityDetail(entity.id);
      });
      listBody.appendChild(row);
    });
  }

  function cacheListData(data, params) {
    const rawNodes = data.data || [];
    const key = viewerScopeKey(params);
    viewerCache = { key, rawNodes, edges: [], hasMore: Boolean(data.has_more) };
    setMoreAvailable(viewerCache.hasMore);

    const nodeIds = rawNodes.map(node => node.id).join(',');
    if (!nodeIds) return;
    fetch(buildUrl('/api/cli/browse/edges', { node_ids: nodeIds }))
      .then(res => res.ok ? res.json() : Promise.reject(new Error(`HTTP ${res.status}`)))
      .then(edgeData => {
        if (!viewerCache || viewerCache.key !== key) return;
        const nodeIdSet = new Set(rawNodes.map(node => node.id));
        viewerCache.edges = (edgeData.edges || [])
          .map(edge => edgeToCyto(edge, nodeIdSet))
          .filter(Boolean);
        if (currentView() === 'graph') renderCachedGraph(params);
      })
      .catch(err => console.error('preload viewer edges error:', err));
  }

  async function loadList(params) {
    const url = buildUrl('/api/cli/browse/nodes', { ...params, page: 1, size: params.limit });
    if (url === _lastListUrl) return;
    _lastListUrl = url;
    setMoreAvailable(false);
    showSpinner();
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      cacheListData(data, params);
      renderList(data.data || [], params);
    } catch (err) {
      console.error('loadList error:', err);
    } finally {
      hideSpinner();
    }
  }

  function initList() {
    document.querySelectorAll('.list-sort').forEach(button => {
      button.addEventListener('click', () => {
        const sort = button.dataset.sort;
        if (!sort) return;
        const current = readUrlState();
        const sortDir = current.sort === sort && current.sort_dir === 'asc' ? 'desc' : 'asc';
        refreshView(collectParams({ view: 'list', sort, sort_dir: sortDir }, true));
      });
    });
    updateListSortHeaders(readUrlState());
  }

  // ── Event wiring ──────────────────────────────────────────────────────────
  function wireTextInputSubmission(input, submit) {
    let lastSubmittedValue = input.value.trim();

    function submitIfChanged() {
      const value = input.value.trim();
      if (value === lastSubmittedValue) return;
      lastSubmittedValue = value;
      submit();
    }

    input.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      submitIfChanged();
    });
    input.addEventListener('blur', submitIfChanged);

    return () => {
      lastSubmittedValue = input.value.trim();
    };
  }

  const markSearchInputSubmitted = wireTextInputSubmission(
    searchInput,
    () => refreshView(collectParams({}, true)),
  );
  const markLookupInputSubmitted = wireTextInputSubmission(lookupInput, () => doLookup());

  platformSel.addEventListener('change', () => refreshGraph());
  sinceSel.addEventListener('change', () => refreshGraph());
  depthInput.addEventListener('change', () => refreshGraph());

  limitSlider.addEventListener('input', () => {
    limitDisplay.textContent = limitSlider.value;
  });
  limitSlider.addEventListener('change', () => refreshGraph());

  function activateMoreResults() {
    if (getComputedStyle(moreBtn).display === 'none') return;
    const currentLimit = Number(limitSlider.value);
    const nextLimit = Math.min(currentLimit * 2, Number(limitSlider.max));
    if (nextLimit <= currentLimit) return;
    limitSlider.value = String(nextLimit);
    limitDisplay.textContent = String(nextLimit);
    refreshGraph();
  }

  function listIsAtEnd() {
    return Math.ceil(nodeTable.scrollTop + nodeTable.clientHeight) >= nodeTable.scrollHeight;
  }

  moreBtn.addEventListener('click', activateMoreResults);
  listView.addEventListener('wheel', (event) => {
    if (event.deltaY <= 0 || currentView() !== 'list' || !listIsAtEnd()) return;
    activateMoreResults();
  }, { passive: true });

  resetBtn.addEventListener('click', () => {
    searchInput.value = '';
    lookupInput.value = '';
    depthInput.value = 1;
    syncDepthEnabled();
    platformSel.value = '';
    sinceSel.value = '';
    limitSlider.value = 50;
    limitDisplay.textContent = '50';
    document.querySelectorAll('.type-filter').forEach(c => c.checked = true);
    markSearchInputSubmitted();
    markLookupInputSubmitted();
    history.replaceState(null, '', window.location.pathname);
    fitGraphToViewport();
    refreshGraph();
  });

  refreshBtn.addEventListener('click', () => forceRefreshGraph());
  graphTab.addEventListener('click', () => setView('graph'));
  listTab.addEventListener('click', () => setView('list'));

  // ── Lookup ────────────────────────────────────────────────────────────────
  async function doLookup() {
    const q = lookupInput.value.trim();
    if (!q) {
      refreshGraph({ node_id: null });
      return;
    }
    lookupError.style.display = 'none';
    showSpinner();
    try {
      const res = await fetch('/api/cli/entity/' + q);
      if (res.status === 404) {
        lookupError.textContent = 'Not found';
        lookupError.style.display = 'block';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const entity = await res.json();
      await refreshGraph({ node_id: entity.id, depth: 1 });
      showEntityDetail(entity.id);
    } catch (err) {
      lookupError.textContent = 'Lookup failed';
      lookupError.style.display = 'block';
      console.error('lookup error:', err);
    } finally {
      hideSpinner();
    }
  }

  function syncDepthEnabled() {
    const hasNode = lookupInput.value.trim() !== '';
    depthInput.disabled = !hasNode;
    depthInput.style.opacity = hasNode ? '1' : '0.4';
    depthInput.style.cursor = hasNode ? '' : 'not-allowed';
  }

  lookupInput.addEventListener('input', syncDepthEnabled);
  lookupBtn.addEventListener('click', () => {
    markLookupInputSubmitted();
    doLookup();
  });
  focusResetBtn.addEventListener('click', () => {
    lookupInput.value = '';
    depthInput.value = 1;
    lookupError.style.display = 'none';
    syncDepthEnabled();
    refreshGraph({ node_id: null, depth: 1 });
  });
  // ── Detail panel ──────────────────────────────────────────────────────────
  function closeDetail() {
    detail.classList.remove('open');
  }

  detailClose.addEventListener('click', closeDetail);

  function tagEl(text, color) {
    const el = document.createElement('span');
    el.className = 'tag';
    el.textContent = text;
    el.style.background = color + '22';
    el.style.color = color;
    el.style.border = `1px solid ${color}55`;
    return el;
  }

  function row(label, valueHtml) {
    const d = document.createElement('div');
    d.className = 'detail-row';
    d.innerHTML = `<div class="detail-label">${label}</div><div class="detail-value">${valueHtml}</div>`;
    return d;
  }

  async function readErrorDetail(res) {
    try {
      const data = await res.json();
      if (data && typeof data.detail === 'string' && data.detail) return data.detail;
    } catch (_) {
      // Ignore non-JSON error bodies.
    }
    return `HTTP ${res.status}`;
  }

  async function showEntityDetail(entityId) {
    showSpinner();
    try {
      const [entityRes, edgesRes] = await Promise.all([
        fetch('/api/cli/entity/' + entityId),
        fetch('/api/cli/edges/' + entityId),
      ]);
      if (!entityRes.ok) throw new Error(`HTTP ${entityRes.status}`);
      const entity = await entityRes.json();
      const edges = edgesRes.ok ? await edgesRes.json() : [];
      renderDetail({ ...entity, edges });
    } catch (err) {
      console.error('showEntityDetail error:', err);
    } finally {
      hideSpinner();
    }
  }

  function entityContentType(entity) {
    const metadata = entity && entity.metadata;
    const declared = metadata && typeof metadata.content_type === 'string'
      ? metadata.content_type.split(';', 1)[0].trim().toLowerCase()
      : '';
    if (declared) return declared;
    // Older entities predate content_type. Only opt into HTML for an obvious
    // document signature; unknown content remains escaped plain text.
    if (/^\s*<!doctype\s+html\b/i.test(entity.content || '')
      || /^\s*<html(?:\s|>)/i.test(entity.content || '')) {
      return 'text/html';
    }
    return 'text/plain';
  }

  function safeHtmlPreview(source) {
    const preview = document.createElement('article');
    preview.className = 'content-preview';

    function fallbackText() {
      preview.textContent = source.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      return preview;
    }

    // If either dependency is unavailable, fail closed and show readable text.
    if (typeof window.DOMParser !== 'function'
      || typeof window.Readability !== 'function'
      || !window.DOMPurify
      || typeof window.DOMPurify.sanitize !== 'function') {
      return fallbackText();
    }

    try {
      const documentNode = new DOMParser().parseFromString(source, 'text/html');
      const parsed = new window.Readability(documentNode).parse();
      const candidate = parsed && parsed.content ? parsed.content : documentNode.body.innerHTML;
      const clean = window.DOMPurify.sanitize(candidate, {
        ALLOWED_TAGS: [
          'a', 'abbr', 'article', 'b', 'blockquote', 'br', 'code', 'del', 'div',
          'em', 'figcaption', 'figure', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr',
          'i', 'li', 'main', 'mark', 'ol', 'p', 'pre', 'q', 's', 'section', 'small',
          'span', 'strong', 'sub', 'sup', 'table', 'tbody', 'td', 'tfoot', 'th',
          'thead', 'tr', 'u', 'ul',
        ],
        ALLOWED_ATTR: ['colspan', 'href', 'rel', 'rowspan', 'scope', 'target', 'title'],
        FORBID_TAGS: ['form', 'iframe', 'input', 'object', 'script', 'style', 'svg', 'video'],
        FORBID_ATTR: ['style', 'src', 'srcset'],
        ALLOW_DATA_ATTR: false,
      });
      preview.innerHTML = clean;
    } catch (_) {
      return fallbackText();
    }
    preview.querySelectorAll('a').forEach(link => {
      link.setAttribute('target', '_blank');
      link.setAttribute('rel', 'noopener noreferrer');
    });
    if (!preview.textContent.trim()) preview.textContent = 'No readable content';
    return preview;
  }

  function renderContent(entity) {
    const source = String(entity.content || '');
    const contentType = entityContentType(entity);
    const isHtml = contentType === 'text/html' || contentType === 'application/xhtml+xml';
    const block = document.createElement('div');
    block.className = 'content-block';

    const toolbar = document.createElement('div');
    toolbar.className = 'content-toolbar';
    const format = document.createElement('div');
    format.className = 'content-format';
    format.textContent = contentType;
    format.setAttribute('role', 'button');
    format.setAttribute('tabindex', '0');
    format.setAttribute('aria-expanded', 'true');
    format.title = 'Hide content';
    toolbar.appendChild(format);

    const tabs = document.createElement('div');
    tabs.className = 'content-tabs';
    const previewTab = document.createElement('button');
    previewTab.className = 'content-tab';
    previewTab.type = 'button';
    previewTab.textContent = 'Preview';
    const sourceTab = document.createElement('button');
    sourceTab.className = 'content-tab';
    sourceTab.type = 'button';
    sourceTab.textContent = 'Source';
    tabs.append(previewTab, sourceTab);
    toolbar.appendChild(tabs);
    block.appendChild(toolbar);

    if (!isHtml) {
      previewTab.disabled = true;
      sourceTab.disabled = true;
      previewTab.setAttribute('aria-disabled', 'true');
      sourceTab.setAttribute('aria-disabled', 'true');
    }

    const preview = isHtml
      ? safeHtmlPreview(source)
      : document.createElement('pre');
    if (contentType !== 'text/html') {
      preview.className = 'content-source';
      preview.textContent = source;
    }
    const sourceView = document.createElement('pre');
    sourceView.className = 'content-source';
    sourceView.textContent = source;
    sourceView.hidden = true;
    block.append(preview, sourceView);

    function selectContentMode(mode) {
      const showingPreview = mode === 'preview';
      preview.hidden = !showingPreview;
      sourceView.hidden = showingPreview;
      previewTab.setAttribute('aria-selected', showingPreview ? 'true' : 'false');
      sourceTab.setAttribute('aria-selected', showingPreview ? 'false' : 'true');
    }
    previewTab.setAttribute('aria-selected', 'true');
    sourceTab.setAttribute('aria-selected', 'false');
    previewTab.addEventListener('click', () => selectContentMode('preview'));
    sourceTab.addEventListener('click', () => selectContentMode('source'));

    function toggleContent() {
      const isExpanded = format.getAttribute('aria-expanded') === 'true';
      format.setAttribute('aria-expanded', isExpanded ? 'false' : 'true');
      format.title = isExpanded ? 'Show content' : 'Hide content';
      tabs.hidden = isExpanded;
      if (isExpanded) {
        preview.hidden = true;
        sourceView.hidden = true;
        return;
      }
      const showingPreview = previewTab.getAttribute('aria-selected') === 'true';
      preview.hidden = !showingPreview;
      sourceView.hidden = showingPreview;
    }

    format.addEventListener('click', toggleContent);
    format.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      toggleContent();
    });
    return block;
  }

  function renderDetail(entity) {
    detailTitle.textContent = entity.title || entity.display_name || entity.id;
    detailBody.innerHTML = '';

    const isBookmarked = Boolean(entity.bookmarked);
    detailBookmark.setAttribute('aria-pressed', isBookmarked ? 'true' : 'false');
    detailBookmark.setAttribute('aria-label', isBookmarked ? 'Remove bookmark' : 'Bookmark entity');
    detailBookmark.title = isBookmarked ? 'Bookmarked' : 'Not bookmarked';
    detailBookmark.disabled = false;

    const bookmarkError = document.createElement('div');
    bookmarkError.style.color = '#fca5a5';
    bookmarkError.style.fontSize = '11px';
    bookmarkError.style.lineHeight = '1.4';
    bookmarkError.style.display = 'none';

    detailBookmark.onclick = async () => {
      const desiredBookmarked = !isBookmarked;
      detailBookmark.disabled = true;
      detailBookmark.title = desiredBookmarked ? 'Bookmarking…' : 'Removing bookmark…';
      bookmarkError.textContent = '';
      bookmarkError.style.display = 'none';
      try {
        const res = await fetch(
          `/api/cli/bookmark?entity_id=${encodeURIComponent(entity.id)}&bookmarked=${desiredBookmarked ? 'true' : 'false'}`,
          { method: 'POST' }
        );
        if (!res.ok) throw new Error(await readErrorDetail(res));
        const updated = await res.json();
        const node = cy.getElementById(entity.id);
        if (node.length) {
          node.data('bookmarked', Boolean(updated.bookmarked));
          applyZoomStyles();
          cy.style().update();
        }
        invalidateGraphCache();
        renderDetail({ ...entity, ...updated });
      } catch (err) {
        detailBookmark.disabled = false;
        detailBookmark.title = isBookmarked ? 'Bookmarked' : 'Not bookmarked';
        bookmarkError.textContent = err instanceof Error ? err.message : 'Bookmark failed';
        bookmarkError.style.display = 'block';
        console.error('bookmark error:', err);
      }
    };

    detailBody.appendChild(bookmarkError);

    detailDelete.disabled = false;
    detailDelete.title = 'Delete entity';
    detailDelete.onclick = async () => {
      if (!window.confirm('Delete this entity from the graph? Connected edges will also be removed.')) return;
      detailDelete.disabled = true;
      detailDelete.title = 'Deleting…';
      try {
        const res = await fetch(
          `/api/cli/delete?target=${encodeURIComponent(entity.id)}`,
          { method: 'POST' }
        );
        if (!res.ok) throw new Error(await readErrorDetail(res));
        const node = cy.getElementById(entity.id);
        if (node.length) node.connectedEdges().remove();
        if (node.length) node.remove();
        invalidateGraphCache();
        closeDetail();
      } catch (err) {
        detailDelete.disabled = false;
        detailDelete.title = 'Delete entity';
        bookmarkError.textContent = err instanceof Error ? err.message : 'Delete failed';
        bookmarkError.style.display = 'block';
        console.error('delete error:', err);
      }
    };

    const typeColor = nodeColor(entity.entity_type);
    const typeRow = document.createElement('div');
    typeRow.className = 'detail-row';
    const typeLabel = document.createElement('div');
    typeLabel.className = 'detail-label';
    typeLabel.textContent = 'Type';
    const typeVal = document.createElement('div');
    typeVal.className = 'detail-value';
    typeVal.appendChild(tagEl(entity.entity_type, typeColor));
    typeRow.appendChild(typeLabel);
    typeRow.appendChild(typeVal);
    detailBody.appendChild(typeRow);

    detailBody.appendChild(row('ID', `<span style="font-family:monospace;font-size:11px">${escHtml(entity.id)}</span>`));

    if (entity.platform) {
      detailBody.appendChild(row('Platform', escHtml(entity.platform)));
    }

    const platformUrl = getPlatformUrl(entity);
    if (platformUrl) {
      const linkHtml = `<a href="${escHtml(platformUrl)}" target="_blank" rel="noopener" style="color:#60a5fa">Open ↗</a>`;
      detailBody.appendChild(row('Link', linkHtml));
    }

    const email = (entity.metadata && entity.metadata.canonical_email) || entity.content;
    if (entity.entity_type === 'Person' && email) {
      detailBody.appendChild(row('Email', escHtml(email)));
    }
    if (entity.entity_type === 'Person') {
      const mergedPeople = renderMergedPeople(entity.metadata);
      if (mergedPeople) detailBody.appendChild(mergedPeople);
    }

    if (entity.content) {
      detailBody.appendChild(renderContent(entity));
    }

    if (entity.created_at) {
      detailBody.appendChild(row('Created', new Date(entity.created_at).toLocaleString()));
    }

    if (entity.entity_type === 'Person') {
      detailBody.appendChild(renderPersonUnificationControls(entity));
    }

    // Fetch button for any entity backed by a connector
    if (FETCHABLE_PLATFORMS.has(entity.platform) && entity.platform_entity_id) {
      const fetchRow = document.createElement('div');
      fetchRow.className = 'control-group';
      const fetchBtn = document.createElement('button');
      const fetchError = document.createElement('div');
      fetchBtn.textContent = 'Fetch content';
      fetchBtn.style.marginTop = '4px';
      fetchError.style.color = '#fca5a5';
      fetchError.style.fontSize = '11px';
      fetchError.style.lineHeight = '1.4';
      fetchError.style.display = 'none';
      fetchBtn.addEventListener('click', async () => {
        fetchBtn.textContent = 'Fetching…';
        fetchBtn.disabled = true;
        fetchError.textContent = '';
        fetchError.style.display = 'none';
        try {
          const res = await fetch(
            `/api/cli/fetch-entity?entity_id=${encodeURIComponent(entity.id)}`,
            { method: 'POST' }
          );
          if (!res.ok) throw new Error(await readErrorDetail(res));
          await showEntityDetail(entity.id);
          forceRefreshGraph();
        } catch (err) {
          fetchBtn.textContent = 'Fetch content';
          fetchBtn.disabled = false;
          fetchError.textContent = err instanceof Error ? err.message : 'Fetch failed';
          fetchError.style.display = 'block';
          console.error('fetch error:', err);
          return;
        }
        fetchBtn.textContent = 'Fetch content';
        fetchBtn.disabled = false;
      });
      fetchRow.appendChild(fetchBtn);
      fetchRow.appendChild(fetchError);
      detailBody.appendChild(fetchRow);
    }

    // Edges
    const edges = entity.edges || [];
    if (edges.length > 0) {
      const edgesSection = document.createElement('div');
      edgesSection.className = 'detail-row';
      const edgesLabel = document.createElement('div');
      edgesLabel.className = 'detail-label';
      edgesLabel.textContent = `Edges (${edges.length})`;
      edgesSection.appendChild(edgesLabel);

      const edgesList = document.createElement('div');
      edgesList.className = 'edges-list';

      edges.slice(0, 20).forEach(edge => {
        const item = document.createElement('div');
        item.className = 'edge-item';

        const edgeColor = EDGE_COLORS[edge.edge_type] || '#64748b';
        const typeSpan = document.createElement('span');
        typeSpan.className = 'edge-type-tag';
        typeSpan.style.color = edgeColor;
        typeSpan.textContent = edge.edge_type;
        item.appendChild(typeSpan);

        const targetId = edge.target_entity_id;
        const srcId    = edge.source_entity_id;
        const otherId  = targetId !== entity.id ? targetId : srcId;

        if (otherId) {
          const direction = targetId === entity.id ? '← from ' : '→ to ';
          const text = document.createTextNode(direction + otherId.substring(0, 24) + '…');
          item.appendChild(text);
          item.addEventListener('click', () => {
            // Centre graph on the neighbour
            refreshGraph({ node_id: otherId, limit: Number(limitSlider.value) });
            showEntityDetail(otherId);
          });
        }

        edgesList.appendChild(item);
      });

      edgesSection.appendChild(edgesList);
      detailBody.appendChild(edgesSection);
    }

    detail.classList.add('open');
  }

  function renderMergedPeople(metadata) {
    const people = Array.isArray(metadata && metadata.merged_people)
      ? metadata.merged_people.filter(person => person && typeof person === 'object')
      : [];
    if (people.length === 0) return null;

    const section = document.createElement('div');
    section.className = 'detail-row';
    const label = document.createElement('div');
    label.className = 'detail-label';
    label.textContent = `Merged people (${people.length})`;
    section.appendChild(label);

    const list = document.createElement('div');
    list.className = 'merged-people-list';
    people.forEach(person => {
      const item = document.createElement('div');
      item.className = 'merged-person-item';
      const title = document.createElement('strong');
      title.textContent = person.title || person.platform_entity_id || person.id || 'Person';
      item.appendChild(title);
      const reference = person.platform_entity_id || person.id;
      if (reference) item.appendChild(document.createTextNode(reference));
      list.appendChild(item);
    });
    section.appendChild(list);
    return section;
  }

  function renderPersonUnificationControls(entity) {
    const group = document.createElement('div');
    group.className = 'control-group';

    const label = document.createElement('label');
    label.className = 'group-label';
    label.textContent = 'Merge duplicate people';
    group.appendChild(label);

    const duplicateInput = document.createElement('input');
    duplicateInput.type = 'text';
    duplicateInput.placeholder = 'IDs or platform references';
    duplicateInput.setAttribute('aria-label', 'Duplicate person IDs or platform references');
    group.appendChild(duplicateInput);

    const mergeButton = document.createElement('button');
    mergeButton.type = 'button';
    mergeButton.textContent = 'Merge into this person';
    group.appendChild(mergeButton);

    const mergeError = document.createElement('div');
    mergeError.className = 'person-merge-error';
    group.appendChild(mergeError);

    mergeButton.addEventListener('click', async () => {
      const duplicateIds = duplicateInput.value
        .split(',')
        .map(value => value.trim())
        .filter(Boolean);
      if (duplicateIds.length === 0) {
        mergeError.textContent = 'Enter at least one duplicate person ID.';
        mergeError.style.display = 'block';
        return;
      }
      if (!window.confirm(`Merge ${duplicateIds.length} person(s) into this canonical person?`)) return;

      mergeButton.disabled = true;
      duplicateInput.disabled = true;
      mergeButton.textContent = 'Merging…';
      mergeError.textContent = '';
      mergeError.style.display = 'none';
      try {
        const res = await fetch(
          buildUrl('/api/cli/unify-persons', { primary: entity.id, duplicate: duplicateIds }),
          { method: 'POST' },
        );
        if (!res.ok) throw new Error(await readErrorDetail(res));
        const result = await res.json();
        const primary = result.primary;
        if (!primary || !primary.id) throw new Error('Server did not return the canonical person.');

        lookupInput.value = primary.id;
        depthInput.value = '1';
        syncDepthEnabled();
        markLookupInputSubmitted();
        await forceRefreshGraph({ node_id: primary.id, depth: 1 });
        await showEntityDetail(primary.id);
      } catch (err) {
        mergeButton.disabled = false;
        duplicateInput.disabled = false;
        mergeButton.textContent = 'Merge into this person';
        mergeError.textContent = err instanceof Error ? err.message : 'Person merge failed';
        mergeError.style.display = 'block';
        console.error('person merge error:', err);
      }
    });

    return group;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function isHttpUrl(value) {
    if (!value || typeof value !== 'string') return false;
    try {
      const parsed = new URL(value);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:';
    } catch (_) {
      return false;
    }
  }

  function getPlatformUrl(entity) {
    const metadata = entity.metadata || {};
    return isHttpUrl(metadata.web_url) ? metadata.web_url : null;
  }

  function positionHoverCard(node) {
    if (!hoverCard.classList.contains('open')) return;

    const rendered = node.renderedPosition();
    const canvasRect = cy.container().getBoundingClientRect();
    const cardRect = hoverCard.getBoundingClientRect();
    const offset = 14;

    let left = rendered.x + offset;
    let top = rendered.y + offset;

    if (left + cardRect.width > canvasRect.width - 12) {
      left = rendered.x - cardRect.width - offset;
    }
    if (top + cardRect.height > canvasRect.height - 12) {
      top = rendered.y - cardRect.height - offset;
    }

    left = Math.max(12, left);
    top = Math.max(12, top);

    hoverCard.style.left = `${left}px`;
    hoverCard.style.top = `${top}px`;
  }

  function hideHoverCard() {
    hoverCard.classList.remove('open');
  }

  function showHoverCard(node) {
    const data = node.data();
    hoverCardType.textContent = data.entity_type || 'Entity';
    hoverCardTitle.textContent = data.label || data.id || 'Untitled';

    const metaParts = [];
    if (data.platform) metaParts.push(data.platform);
    if (data.platform_entity_id) metaParts.push(truncateLabel(data.platform_entity_id, 40));
    hoverCardMeta.textContent = metaParts.join(' • ');

    if (data.content) {
      hoverCardSnippet.textContent = truncateLabel(data.content, 180);
      hoverCardSnippet.style.display = 'block';
    } else {
      hoverCardSnippet.textContent = '';
      hoverCardSnippet.style.display = 'none';
    }

    hoverCard.classList.add('open');
    positionHoverCard(node);
  }

  // ── Cytoscape events ──────────────────────────────────────────────────────
  function focusNode(entityId) {
    lookupInput.value = entityId;
    syncDepthEnabled();
    refreshGraph({ node_id: entityId });
  }

  cy.on('mouseover', 'node', (evt) => {
    showHoverCard(evt.target);
  });

  cy.on('mouseout', 'node', () => {
    hideHoverCard();
  });

  cy.on('mousemove', 'node', (evt) => {
    positionHoverCard(evt.target);
  });

  cy.on('pan zoom resize', () => {
    hideHoverCard();
  });

  cy.on('tap', 'node', (evt) => {
    const node = evt.target;
    hideHoverCard();
    showEntityDetail(node.data('id'));
  });

  cy.on('dbltap', 'node', (evt) => {
    const node = evt.target;
    focusNode(node.data('id'));
  });

  cy.on('tap', (evt) => {
    if (evt.target === cy) {
      hideHoverCard();
      closeDetail();
      cy.nodes().unselect();
    }
  });

  // ── History navigation ────────────────────────────────────────────────────
  window.addEventListener('popstate', () => {
    const state = readUrlState();
    applyUrlState(state);
    refreshView(collectParams({}, true));
  });

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  async function loadMeta() {
    try {
      const res = await fetch('/api/cli/meta');
      if (!res.ok) return;
      const meta = await res.json();

      // Populate entity type checkboxes
      if (Array.isArray(meta.entity_types) && meta.entity_types.length) {
        ALL_TYPES = meta.entity_types;
        const group = document.getElementById('type-filter-group');
        meta.entity_types.forEach(t => {
          const label = document.createElement('label');
          label.className = 'checkbox-row';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'type-filter';
          cb.value = t;
          cb.checked = true;
          cb.addEventListener('change', () => refreshGraph());
          cb.addEventListener('click', (e) => {
            if (e.altKey) {
              e.preventDefault();
              const wasSoleSelected = !cb.checked && typeFilters().length === 0;
              document.querySelectorAll('.type-filter').forEach(c => {
                c.checked = wasSoleSelected || c === cb;
              });
              refreshGraph();
            }
          });
          const span = document.createElement('span');
          span.style.color = TYPE_COLORS[t] || '#94a3b8';
          span.textContent = t;
          label.appendChild(cb);
          label.appendChild(span);
          group.appendChild(label);
        });
      }

      // Populate platform dropdown + fetchable set
      if (Array.isArray(meta.platforms) && meta.platforms.length) {
        FETCHABLE_PLATFORMS = new Set(meta.platforms);
        const sel = document.getElementById('platform-filter');
        meta.platforms.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          sel.appendChild(opt);
        });
      }
    } catch (_) { /* server not running yet — static fallbacks remain empty */ }
  }

  const TYPE_COLORS = NODE_COLORS;

  loadMeta().then(async () => {
    const _initial = readUrlState();
    applyUrlState(_initial);
    markSearchInputSubmitted();
    markLookupInputSubmitted();
    syncDepthEnabled();
    initList();
    await refreshView(collectParams({}, true));
    if (_initial.node_id) showEntityDetail(_initial.node_id);
  });

})();
</script>
