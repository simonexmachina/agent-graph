<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentGraph</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>AgentGraph</h1>
      <span id="status-dot" class="dot dot--unknown" title="Server status"></span>
    </header>

    <section id="current-tab">
      <p class="label">Currently observing</p>
      <p id="current-url" class="url">—</p>
    </section>

    <section id="server">
      <p class="label">Server URL</p>
      <p id="server-url" class="url">—</p>
    </section>

    <section id="patterns">
      <p class="label">URL patterns</p>
      <p id="pattern-count">—</p>
    </section>

    <section id="observation">
      <p class="label">Observation</p>
      <p id="observation-status" class="status status--unknown">Checking…</p>
    </section>

    <button id="reload-patterns" type="button">Reload URL patterns</button>
    <button id="open-options" type="button" class="button-secondary">Server settings</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
