<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentGraph Server Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>AgentGraph server</h1>
      <p class="intro">
        Configure the local AgentGraph server this extension should talk to.
        Only <code>http://localhost:&lt;port&gt;</code> and
        <code>http://127.0.0.1:&lt;port&gt;</code> are accepted.
      </p>
      <form id="server-form">
        <label for="server-url">Server URL</label>
        <input id="server-url" name="server-url" type="url" placeholder="http://localhost:8765" required />
        <p id="form-status" class="form-status" role="status"></p>
        <div class="actions">
          <button type="submit">Save</button>
          <button id="reset-defaults" type="button" class="button-secondary">Reset to default</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
